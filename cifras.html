<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cifras — Ministração</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #111827; color: #fff; }

/* NAV */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: #0d1117; border-bottom: 1px solid #1f2937;
  display: flex; align-items: center; gap: 0; overflow-x: auto;
  scrollbar-width: none;
}
nav::-webkit-scrollbar { display: none; }
nav button {
  flex-shrink: 0; border: none; background: transparent;
  color: #9ca3af; font-size: 0.8rem; font-weight: 600;
  padding: 0.75rem 1.1rem; cursor: pointer; white-space: nowrap;
  border-bottom: 3px solid transparent; transition: all 0.15s;
  font-family: inherit;
}
nav button:hover { color: #fff; background: #1f2937; }
nav button.active { color: #fff; border-bottom-color: var(--c); }

/* PAGES */
.pages { padding-top: 44px; }
.page { display: none; padding: 1.5rem 1.25rem 2.5rem; max-width: 1100px; margin: 0 auto; }
.page.active { display: block; }

.page-header { margin-bottom: 1.25rem; }
.page-title { font-size: 1.8rem; font-weight: 800; line-height: 1.1; }
.page-artist { font-size: 0.95rem; color: #9ca3af; margin-top: 4px; }
.page-accent { display: inline-block; width: 40px; height: 4px; border-radius: 2px; margin-bottom: 10px; }

/* GRID of sections */
.sections-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 0.85rem;
}
.sec-card {
  background: #1f2937; border-radius: 10px;
  border-left: 4px solid var(--c);
  padding: 0.85rem 1rem;
}
.sec-label { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em; color: #6b7280; margin-bottom: 3px; }
.sec-phrase { font-size: 0.82rem; color: #9ca3af; font-style: italic; margin-bottom: 10px; }
.chord-row { display: flex; flex-wrap: wrap; gap: 5px; }
.chord {
  font-family: 'Courier New', monospace; font-size: 1rem; font-weight: 700;
  padding: 4px 11px; border-radius: 6px;
  background: rgba(255,255,255,0.07);
  border: 1.5px solid var(--c);
  color: var(--c);
}
</style>
</head>
<body>

<nav id="nav"></nav>
<div class="pages" id="pages"></div>

<script>
const songs = [
  {
    title: "Gratidão", artist: "Felipe Rodrigues", sub: "Ministração ao vivo", color: "#7C6EF5",
    sections: [
      { label: "Trecho 1 — Intro", phrase: "Instrumental, sem letra", chords: ["B","G#","F#","E"] },
      { label: "Trecho 2 — Primeira parte", phrase: '"Nada novo achei"', chords: ["B","G#","F#","E"] },
      { label: "Trecho 3 — Refrão (primeira parte)", phrase: '"Então vou levantar"', chords: ["B","F#","E","G#","F#"] },
      { label: "Trecho 4 — Refrão (segunda parte)", phrase: '"Sei que é simples pra um Rei"', chords: ["B","F#","E","G#","F#","B"] },
      { label: "Trecho 5 — Ponte", phrase: '"Ei, meu coração não se envergonhe"', chords: ["B","F#","E","G#","F#"] },
      { label: "Trecho 6 — Final do refrão (variação)", phrase: '"Aleluia, Aleluia" — parte final', chords: ["C#","B","F#","B","E"] },
    ]
  },
  {
    title: "Santo Espírito", artist: "Leo Rezende", sub: "Ministração ao vivo", color: "#2DB87B",
    sections: [
      { label: "Trecho 1 — Intro", phrase: "Instrumental, sem letra", chords: ["A","D"] },
      { label: "Trecho 2 — Primeira parte (verso 1)", phrase: '"Não há nada igual"', chords: ["A","D"] },
      { label: "Trecho 3 — Segunda parte (verso 2)", phrase: '"Eu provei e vi"', chords: ["A","D","A","D"] },
      { label: "Trecho 4 — Refrão", phrase: '"Santo Espírito, és bem-vindo aqui"', chords: ["A","D","Bm","A","D","Bm"] },
      { label: 'Trecho 5 — Ponte ("Vamos provar")', phrase: '"Vamos provar quão real é Tua presença"', chords: ["D","A","Bm","A"] },
      { label: "Trecho 6 — Final da ponte", phrase: '"Vamos provar a Tua glória e bondade Senhor"', chords: ["D","A","Bm","A","D"] },
    ]
  },
  {
    title: "Tudo é Perda", artist: "Felipe Rodrigues", sub: "Ao vivo", color: "#E96058",
    sections: [
      { label: "Trecho 1 — Intro", phrase: "Instrumental, sem letra", chords: ["A#","Gm","F","D#"] },
      { label: "Trecho 2 — Primeira parte", phrase: '"Tudo é perda se não tenho a Ti"', chords: ["A#","Gm","F","D#"] },
      { label: "Trecho 3 — Pré-refrão (parte 1)", phrase: '"Do que adianta eu ganhar o mundo inteiro"', chords: ["D#","F","A#","D#"] },
      { label: "Trecho 4 — Pré-refrão (parte 2)", phrase: '"Do que adianta eu juntar os meus tesouros"', chords: ["D#","F","A#","D#"] },
      { label: "Trecho 5 — Refrão", phrase: '"Se eu não tenho a Ti, não tenho nada"', chords: ["Cm","A#","F","A#","D#","Cm","A#","F","A#","D#"] },
      { label: "Trecho 6 — Ponte", phrase: '"Tua presença é o que me basta"', chords: ["Cm","F","A#","D#"] },
    ]
  },
  {
    title: "Oceanos / Rendido Estou", artist: "Sara Vivian", sub: "Ministração ao vivo", color: "#F0A500",
    sections: [
      { label: "Trecho 1 — Intro", phrase: "Instrumental, sem letra", chords: ["Am"] },
      { label: "Trecho 2 — Primeira parte (verso)", phrase: '"Guia-me pra que em tudo em Ti confie"', chords: ["Am","F","C","G"] },
      { label: "Trecho 3 — Segunda parte (verso com inversões)", phrase: '"Guia-me..." — versão com F/A e C/G', chords: ["Am","F","C","G"] },
      { label: 'Trecho 4 — Ponte ("Ao Teu Nome clamarei")', phrase: '"Ao Teu Nome clamarei"', chords: ["F","Am","G","F","Am","G","F","Am","G","G","C","F","G","Am","C","F","G","Am"] },
      { label: 'Trecho 5 — Refrão ("Oh, oh, oh, oh")', phrase: '"Oh, oh, oh, oh"', chords: ["C","G","Am","Dm","C","G"] },
      { label: 'Trecho 6 — "Minha vida dou a Ti"', phrase: '"Minha vida dou a Ti, Senhor"', chords: ["C","G","Am","G","F","G","F","G"] },
      { label: "Trecho 7 — Finalização", phrase: '"Faz em mim o Teu querer" — repetição', chords: ["C","F","Am","G","F","Am","G","F","G"] },
      { label: "Trecho 8 — Outro", phrase: "Instrumental final", chords: ["C"] },
    ]
  },
  {
    title: "Meu Alvo", artist: "Kleber Lucas", sub: "", color: "#3A8FDD",
    sections: [
      { label: "Trecho 1 — Intro", phrase: "Instrumental, sem letra", chords: ["Bb","Eb","Gm","Eb"] },
      { label: "Trecho 2 — Primeira parte (verso 1)", phrase: '"Estou subindo pra um lugar mais alto"', chords: ["Bb","Gm","Bb","Gm","Eb","Ebm","Bb","F","F4","F","Gm","F","Eb"] },
      { label: "Trecho 3 — Refrão", phrase: '"Vou avançar eu vou crescer"', chords: ["Bb","F","Gm","Eb"] },
      { label: "Trecho 4 — Segunda parte (verso 2)", phrase: '"Estou subindo pra um lugar mais alto"', chords: ["Bb","Gm","Bb","Gm","Eb","Ebm","Bb","F","F4","F","Gm","F","Eb"] },
      { label: "Trecho 5 — Riff (instrumental)", phrase: "Riff instrumental", chords: ["Bb","Eb","Gm","Eb"] },
      { label: "Trecho 6 — Refrão final com variação", phrase: '"Vou avançar eu vou crescer" — terminando em "Cristo"', chords: ["Bb","F","Gm","Eb","Bb","F","Gm","Eb"] },
    ]
  }
];

const nav = document.getElementById('nav');
const pages = document.getElementById('pages');

songs.forEach((song, i) => {
  // nav button
  const btn = document.createElement('button');
  btn.textContent = song.title;
  btn.style.setProperty('--c', song.color);
  btn.onclick = () => switchTo(i);
  if (i === 0) btn.classList.add('active');
  nav.appendChild(btn);

  // page
  const page = document.createElement('div');
  page.className = 'page' + (i === 0 ? ' active' : '');
  page.style.setProperty('--c', song.color);

  const sectionsHtml = song.sections.map(sec => `
    <div class="sec-card">
      <div class="sec-label">${sec.label}</div>
      <div class="sec-phrase">${sec.phrase}</div>
      <div class="chord-row">${sec.chords.map(c => `<span class="chord">${c}</span>`).join('')}</div>
    </div>
  `).join('');

  page.innerHTML = `
    <div class="page-header">
      <div class="page-accent" style="background:${song.color}"></div>
      <div class="page-title">${song.title}</div>
      <div class="page-artist">${song.artist}${song.sub ? ' · ' + song.sub : ''}</div>
    </div>
    <div class="sections-grid">${sectionsHtml}</div>
  `;
  pages.appendChild(page);
});

function switchTo(idx) {
  document.querySelectorAll('nav button').forEach((b, i) => b.classList.toggle('active', i === idx));
  document.querySelectorAll('.page').forEach((p, i) => p.classList.toggle('active', i === idx));
}
</script>
</body>
</html>
