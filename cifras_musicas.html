
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }
.container { padding: 1rem 0; }
.search-bar { margin-bottom: 1.5rem; }
.search-bar input { width: 100%; font-size: 15px; padding: 0.5rem 0.75rem; }
.song-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); margin-bottom: 1.25rem; overflow: hidden; }
.song-header { padding: 1rem 1.25rem; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 0.5px solid var(--color-border-tertiary); }
.song-header:hover { background: var(--color-background-secondary); }
.song-title { font-size: 15px; font-weight: 500; color: var(--color-text-primary); }
.song-artist { font-size: 13px; color: var(--color-text-secondary); margin-top: 2px; }
.song-badge { font-size: 11px; background: var(--color-background-info); color: var(--color-text-info); border-radius: var(--border-radius-md); padding: 3px 8px; white-space: nowrap; flex-shrink: 0; }
.chevron { font-size: 16px; color: var(--color-text-secondary); transition: transform 0.2s; flex-shrink: 0; }
.chevron.open { transform: rotate(180deg); }
.song-body { display: none; padding: 1rem 1.25rem; }
.song-body.open { display: block; }
.section { margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 0.5px solid var(--color-border-tertiary); }
.section:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
.section-label { font-size: 11px; font-weight: 500; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
.section-phrase { font-size: 13px; color: var(--color-text-secondary); margin-bottom: 8px; font-style: italic; }
.chord-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chord { background: var(--color-background-secondary); border: 0.5px solid var(--color-border-secondary); border-radius: 6px; padding: 4px 10px; font-size: 14px; font-weight: 500; color: var(--color-text-primary); font-family: var(--font-mono); }
.header-left { flex: 1; min-width: 0; }
</style>

<div class="container">
  <h2 class="sr-only">Cifras de músicas gospel com trechos e acordes</h2>
  <div class="search-bar">
    <input type="text" placeholder="Buscar música ou artista..." id="searchInput" oninput="filterSongs()" />
  </div>
  <div id="songList"></div>
</div>

<script>

      { label: "Trecho 2 — Primeira parte", phrase: "\"Nada novo achei\"", chords: ["B", "G#", "F#", "E"] },

      { label: "Trecho 5 — Ponte", phrase: "\"Ei, meu coração não se envergonhe\"", chords: ["B", "F#", "E", "G#", "F#"] },
      { label: "Trecho 6 — Final do refrão (variação)", phrase: "\"Aleluia, Aleluia\" — parte final", chords: ["C#", "B", "F#", "B", "E"] },
    ]
  },
  {
    title: "Santo Espírito",
    artist: "Leo Rezende",
    subtitle: "Ministração ao vivo",
    sections: [
      { label: "Trecho 1 — Intro", phrase: "Instrumental, sem letra", chords: ["A", "D"] },
      { label: "Trecho 2 — Primeira parte (verso 1)", phrase: "\"Não há nada igual\"", chords: ["A", "D"] },
      { label: "Trecho 3 — Segunda parte (verso 2)", phrase: "\"Eu provei e vi\"", chords: ["A", "D", "A", "D"] },

      { label: "Trecho 6 — Final da ponte (com \"Senhor\")", phrase: "\"Vamos provar a Tua glória e bondade Senhor\"", chords: ["D", "A", "Bm", "A", "D"] },
    ]
  },
  {
    title: "Tudo é Perda",
    artist: "Felipe Rodrigues",
    subtitle: "Ao vivo",
    sections: [
      { label: "Trecho 1 — Intro", phrase: "Instrumental, sem letra", chords: ["A#", "Gm", "F", "D#"] },
      { label: "Trecho 2 — Primeira parte", phrase: "\"Tudo é perda se não tenho a Ti\"", chords: ["A#", "Gm", "F", "D#"] },
      { label: "Trecho 3 — Pré-refrão (parte 1)", phrase: "\"Do que adianta eu ganhar o mundo inteiro\"", chords: ["D#", "F", "A#", "D#"] },
      { label: "Trecho 4 — Pré-refrão (parte 2)", phrase: "\"Do que adianta eu juntar os meus tesouros\"", chords: ["D#", "F", "A#", "D#"] },
      { label: "Trecho 5 — Refrão", phrase: "\"Se eu não tenho a Ti, não tenho nada\"", chords: ["Cm", "A#", "F", "A#", "D#", "Cm", "A#", "F", "A#", "D#"] },
      { label: "Trecho 6 — Ponte", phrase: "\"Tua presença é o que me basta\"", chords: ["Cm", "F", "A#", "D#"] },
    ]
  },
  {
    title: "Oceanos / Rendido Estou",
    artist: "Sara Vivian",
    subtitle: "Ministração ao vivo",
    sections: [
      { label: "Trecho 1 — Intro", phrase: "Instrumental, sem letra", chords: ["Am"] },
      { label: "Trecho 2 — Primeira parte (verso)", phrase: "\"Guia-me pra que em tudo em Ti confie\"", chords: ["Am", "F", "C", "G"] },
      { label: "Trecho 3 — Segunda parte (verso com inversões)", phrase: "\"Guia-me...\" — versão com F/A e C/G", chords: ["Am", "F", "C", "G"] },
      { label: "Trecho 4 — Ponte (\"Ao Teu Nome clamarei\")", phrase: "\"Ao Teu Nome clamarei\"", chords: ["F", "Am", "G", "F", "Am", "G", "F", "Am", "G", "G", "C", "F", "G", "Am", "C", "F", "G", "Am"] },

    subtitle: "",

      { label: "Trecho 1 — Intro", phrase: "Instrumental, sem letra", chords: ["Bb", "Eb", "Gm", "Eb"] },
      { label: "Trecho 2 — Primeira parte (verso 1)", phrase: "\"Estou subindo pra um lugar mais alto\"", chords: ["Bb", "Gm", "Bb", "Gm", "Eb", "Ebm", "Bb", "F", "F4", "F", "Gm", "F", "Eb"] },
      { label: "Trecho 3 — Refrão", phrase: "\"Vou avançar eu vou crescer\"", chords: ["Bb", "F", "Gm", "Eb"] },
      { label: "Trecho 4 — Segunda parte (verso 2)", phrase: "\"Estou subindo pra um lugar mais alto\"", chords: ["Bb", "Gm", "Bb", "Gm", "Eb", "Ebm", "Bb", "F", "F4", "F", "Gm", "F", "Eb"] },
      { label: "Trecho 5 — Riff (instrumental)", phrase: "Riff instrumental", chords: ["Bb", "Eb", "Gm", "Eb"] },
      { label: "Trecho 6 — Refrão final com variação", phrase: "\"Vou avançar eu vou crescer\" — terminando em \"Cristo\"", chords: ["Bb", "F", "Gm", "Eb", "Bb", "F", "Gm", "Eb"] },
    ]
  }
];

function renderSongs(list) {
  const container = document.getElementById('songList');
  container.innerHTML = '';
  list.forEach((song, i) => {
    const card = document.createElement('div');
    card.className = 'song-card';
    const sectionsHtml = song.sections.map(s => `
      <div class="section">
        <div class="section-label">${s.label}</div>
        <div class="section-phrase">${s.phrase}</div>
        <div class="chord-row">${s.chords.map(c => `<span class="chord">${c}</span>`).join('')}</div>
      </div>
    `).join('');
    card.innerHTML = `
      <div class="song-header" onclick="toggleSong(${i})">
        <div class="header-left">
          <div class="song-title">${song.title}</div>
          <div class="song-artist">${song.artist}${song.subtitle ? ' · ' + song.subtitle : ''}</div>
        </div>
        <span class="song-badge">${song.sections.length} trechos</span>
        <i class="ti ti-chevron-down chevron" id="chev-${i}" aria-hidden="true"></i>
      </div>
      <div class="song-body" id="body-${i}">${sectionsHtml}</div>
    `;
    container.appendChild(card);
  });
}

function toggleSong(i) {
  const body = document.getElementById('body-' + i);
  const chev = document.getElementById('chev-' + i);
  body.classList.toggle('open');
  chev.classList.toggle('open');
}

function filterSongs() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = songs.filter(s =>
    s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q)
  );
  renderSongs(filtered);
}

renderSongs(songs);
</script>
